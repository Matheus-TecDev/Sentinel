name: Docker Publish

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Backend image
    uses: Matheus-TecDev/platform-workflows/.github/workflows/docker-publish.yml@v1
    with:
      context: ./backend
      dockerfile: ./backend/Dockerfile
      image-name: ghcr.io/matheus-tecdev/sentinel-backend

  frontend:
    name: Frontend image
    uses: Matheus-TecDev/platform-workflows/.github/workflows/docker-publish.yml@v1
    with:
      context: ./frontend
      dockerfile: ./frontend/Dockerfile
      image-name: ghcr.io/matheus-tecdev/sentinel-frontend
