name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-ci:
    name: Backend quality
    uses: Matheus-TecDev/platform-workflows/.github/workflows/python-api-ci.yml@v1
    with:
      python-version: "3.12"
      working-directory: backend
      requirements-file: requirements.txt
      dev-requirements-file: requirements-dev.txt

  backend-integration:
    name: Backend PostgreSQL integration
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql+psycopg://sentinel_test:sentinel_test_password@localhost:5432/sentinel_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinel_test
          POSTGRES_USER: sentinel_test
          POSTGRES_PASSWORD: sentinel_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel_test -d sentinel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar dependências do backend
        run: |
          pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run PostgreSQL integration tests
        run: python -m pytest -m integration

      - name: Validar importação da aplicação
        run: |
          python -c "from app.main import app; print('Backend OK')"

  frontend:
    name: Frontend build
    uses: Matheus-TecDev/platform-workflows/.github/workflows/react-web-ci.yml@v1
    with:
      node-version: "20"
      working-directory: frontend
      install-command: npm ci
      lint-command: npm run lint
      test-command: npm test
      build-command: npm run build
      artifact-path: dist
      upload-artifact: false
